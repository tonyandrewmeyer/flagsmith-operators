# This file configures Charmcraft.
# See https://documentation.ubuntu.com/charmcraft/stable/reference/files/charmcraft-yaml-file/
type: charm
name: flagsmith-task-processor
title: Flagsmith Task Processor
summary: The Flagsmith asynchronous task processor.
description: |
  Flagsmith is an open-source feature flag, remote config and A/B testing
  platform. This charm operates the Flagsmith task processor: a worker that
  consumes asynchronous tasks from the shared PostgreSQL database — webhooks,
  audit logging, scheduled flag changes and analytics writes — keeping that work
  off the API request path.

  Running the task processor is strongly recommended in production: without it,
  the API performs this work inline (`TASK_RUN_METHOD=SEPARATE_THREAD`),
  degrading request latency under load.

  The charm takes its database URL and Django secret key from the flagsmith-api
  charm over the `flagsmith-api` relation, so it always agrees with the API on
  the database and signing key. It is stateless and horizontally scalable with
  `juju scale-application`; the API charm owns database migrations.

base: ubuntu@24.04
platforms:
  amd64:
  arm64:

assumes:
  - juju >= 3.6
  - k8s-api

parts:
  charm:
    plugin: uv
    source: .
    build-snaps:
      - astral-uv

containers:
  flagsmith-task-processor:
    resource: flagsmith-image

resources:
  flagsmith-image:
    type: oci-image
    description: OCI image for the Flagsmith task processor workload.
    upstream-source: flagsmith/flagsmith:2.245.0

requires:
  flagsmith-api:
    interface: flagsmith_api
    limit: 1
    optional: false
  logging:
    interface: loki_push_api
    optional: true
  tracing:
    interface: tracing
    limit: 1
    optional: true

provides:
  metrics-endpoint:
    interface: prometheus_scrape
    optional: true
  grafana-dashboard:
    interface: grafana_dashboard
    optional: true

peers:
  task-processor-peers:
    interface: task_processor_peers

config:
  options:
    log-level:
      description: |
        Application log level. One of "DEBUG", "INFO", "WARNING", "ERROR",
        "CRITICAL".
      default: "INFO"
      type: string
    num-threads:
      description: Number of worker threads per task-processor unit (TASK_PROCESSOR_NUM_THREADS).
      default: 5
      type: int
    sleep-interval-ms:
      description: |
        Milliseconds the processor sleeps between polling the task queue
        (TASK_PROCESSOR_SLEEP_INTERVAL_MS). Lower values reduce task latency at
        the cost of more database polling.
      default: 500
      type: int
    queue-pop-size:
      description: Number of tasks fetched from the queue per poll (TASK_PROCESSOR_QUEUE_POP_SIZE).
      default: 10
      type: int
    grace-period-ms:
      description: |
        Milliseconds a task may run past its timeout before being considered
        failed and recovered (TASK_PROCESSOR_GRACE_PERIOD_MS).
      default: 20000
      type: int
    extra-env:
      description: |
        Additional environment variables to inject into the workload, as a JSON
        mapping. Overrides charm-managed environment of the same name.
      default: "{}"
      type: string
