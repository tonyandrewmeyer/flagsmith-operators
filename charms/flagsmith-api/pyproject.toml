[project]
name = "flagsmith-api"
version = "0.0.1"
requires-python = ">=3.10"

# Dependencies of the charm code
# You should list the dependencies of the code in src/, including any charm libraries from PyPI.
# We recommend using uv to maintain this list. For example, 'uv add charmlibs-pathops'.
# If your code uses any libraries from Charmhub, don't list those libraries here. Instead, add a
# 'charm-libs' block in charmcraft.yaml, run `charmcraft fetch-libs` to download the libraries,
# then inspect the libraries for dependencies specified in PYDEPS. List those dependencies here.
dependencies = [
    "cosl>=0.0.53",
    "cryptography>=43.0.0",
    "opentelemetry-exporter-otlp-proto-http>=1.42.1",
    "ops~=3.7",
    "pydantic>=2.13.4",
]

[dependency-groups]
# Dependencies of linting and static type checks
lint = [
    "ruff",
    "codespell",
    "pyright",
]
# Dependencies of unit tests
unit = [
    "coverage[toml]",
    "ops[testing]",
    "pytest",
]
# Dependencies of integration tests
integration = [
    "jubilant",
    "pytest",
    "PyYAML",
]

# Testing tools configuration
[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true

[tool.pytest.ini_options]
minversion = "6.0"
log_cli_level = "INFO"

# Linting tools configuration
[tool.codespell]
skip = "build,lib,venv,icon.svg,.tox,.git,.mypy_cache,.ruff_cache,.coverage,uv.lock"
ignore-words-list = "ser"

[tool.pyright]
include = ["src", "tests"]

[tool.ruff]
line-length = 99
extend-exclude = [
    "lib",
    "__pycache__",
    "*.egg_info",
    "lib/charms",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "C4",
    "N",
    "D",
    "I",
    "UP",
    "B",
    "RUF",
]
ignore = [
    "D105",
    "D107",
    "D203",
    "D204",
    "D213",
    "D215",
    "D400",
    "D404",
    "D406",
    "D407",
    "D408",
    "D409",
    "D413",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["D", "S101", "S105", "S106", "S108", "PLR2004", "ARG", "SLF001", "N802", "N803", "N806"]
"tests/*" = ["D100", "D101", "D102", "D103", "D104"]
