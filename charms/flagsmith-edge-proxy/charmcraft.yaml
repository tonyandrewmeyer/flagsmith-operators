# This file configures Charmcraft.
# See https://documentation.ubuntu.com/charmcraft/stable/reference/files/charmcraft-yaml-file/
type: charm
name: flagsmith-edge-proxy
title: Flagsmith Edge Proxy
summary: The Flagsmith Edge Proxy for low-latency flag evaluation.
description: |
  Flagsmith is an open-source feature flag, remote config and A/B testing
  platform. This charm operates the Flagsmith Edge Proxy: a small read-only
  service that caches environment documents fetched from the Flagsmith API and
  serves flag-evaluation requests to SDKs at very low latency, reducing polling
  load on the API itself.

  Point your server-side SDKs at the proxy's `/api/v1/` endpoint to use it. The
  proxy has no database; it polls the API for environment documents on a
  configurable interval. Configure it with one or more environment key pairs
  (a server-side key and its corresponding client-side key).

  It is stateless and horizontally scalable; per upstream guidance, keep
  `web-concurrency` at 1 and scale out with multiple units behind a load
  balancer.

base: ubuntu@24.04
platforms:
  amd64:
  arm64:

assumes:
  - juju >= 3.6
  - k8s-api

parts:
  charm:
    plugin: uv
    source: .
    build-snaps:
      - astral-uv

containers:
  flagsmith-edge-proxy:
    resource: flagsmith-image

resources:
  flagsmith-image:
    type: oci-image
    description: OCI image for the Flagsmith Edge Proxy workload.
    upstream-source: flagsmith/edge-proxy:2.23.0

requires:
  flagsmith-api:
    interface: flagsmith_api
    limit: 1
    optional: true
  ingress:
    interface: ingress
    limit: 1
    optional: true
  logging:
    interface: loki_push_api
    optional: true

peers:
  edge-proxy-peers:
    interface: edge_proxy_peers

config:
  options:
    log-level:
      description: |
        Application log level. One of "DEBUG", "INFO", "WARNING", "ERROR",
        "CRITICAL".
      default: "INFO"
      type: string
    api-url:
      description: |
        Explicit base URL of the Flagsmith API the proxy should poll, e.g.
        "https://flagsmith.example.com". The "/api/v1" path is appended
        automatically if absent. Overrides the URL learned from the
        flagsmith-api relation; required when no relation is present.
      default: ""
      type: string
    environment-key-pairs:
      description: |
        JSON array of environment key pairs the proxy should serve. Each entry
        needs a server-side key and its corresponding client-side key, e.g.
        '[{"server_side_key": "ser.xxxx", "client_side_key": "yyyy"}]'.
        The proxy serves nothing until at least one pair is configured.
      default: "[]"
      type: string
    api-poll-frequency-seconds:
      description: How often to poll the API for environment changes (seconds).
      default: 10
      type: int
    api-poll-timeout-seconds:
      description: Request timeout when polling the API for changes (seconds).
      default: 5
      type: int
    allow-origins:
      description: |
        JSON array of allowed CORS origins for the proxy, sent in the
        ``Access-Control-Allow-Origin`` response header. The upstream proxy
        parses this with pydantic-settings, which requires a JSON list (not a
        bare string). Use ``["*"]`` to allow any origin.
      default: '["*"]'
      type: string
    web-concurrency:
      description: |
        Number of Uvicorn workers per unit. Upstream recommends 1 when running
        multiple proxy units behind a load balancer.
      default: 1
      type: int
    extra-env:
      description: |
        Additional environment variables to inject into the workload, as a JSON
        mapping. Overrides charm-managed environment of the same name.
      default: "{}"
      type: string
