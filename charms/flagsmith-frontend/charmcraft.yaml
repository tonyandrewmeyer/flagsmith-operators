# This file configures Charmcraft.
# See https://documentation.ubuntu.com/charmcraft/stable/reference/files/charmcraft-yaml-file/
type: charm
name: flagsmith-frontend
title: Flagsmith Frontend
summary: The Flagsmith dashboard frontend.
description: |
  Flagsmith is an open-source feature flag, remote config and A/B testing
  platform. This charm operates the dedicated Flagsmith dashboard frontend: the
  React single-page application served by a small Node server that proxies API
  calls to the Flagsmith API.

  Running a dedicated frontend lets you scale and route the dashboard
  independently of the API. It is an alternative to having the API serve the
  bundled dashboard assets itself; when using this charm, set
  `enable-admin-dashboard=false` on the flagsmith-api application so a single
  dashboard is served.

  The charm learns the API base URL from the flagsmith-api relation (or an
  explicit `api-url` config override) and can be exposed via Traefik ingress.

base: ubuntu@24.04
platforms:
  amd64:
  arm64:

assumes:
  - juju >= 3.6
  - k8s-api

parts:
  charm:
    plugin: uv
    source: .
    build-snaps:
      - astral-uv

containers:
  flagsmith-frontend:
    resource: flagsmith-image

resources:
  flagsmith-image:
    type: oci-image
    description: OCI image for the Flagsmith frontend workload.
    upstream-source: flagsmith/flagsmith-frontend:2.245.0

requires:
  flagsmith-api:
    interface: flagsmith_api
    limit: 1
    optional: false
  ingress:
    interface: ingress
    limit: 1
    optional: true
  logging:
    interface: loki_push_api
    optional: true

provides:
  grafana-dashboard:
    interface: grafana_dashboard
    optional: true

peers:
  frontend-peers:
    interface: frontend_peers

config:
  options:
    log-level:
      description: |
        Application log level. One of "DEBUG", "INFO", "WARNING", "ERROR",
        "CRITICAL".
      default: "INFO"
      type: string
    api-url:
      description: |
        Explicit base URL of the Flagsmith API the frontend should proxy to,
        e.g. "https://flagsmith.example.com". Overrides the URL learned from the
        flagsmith-api relation. Any trailing "/api/v1" is stripped automatically.
      default: ""
      type: string
    disable-analytics:
      description: Disable frontend analytics/telemetry.
      default: false
      type: boolean
    extra-env:
      description: |
        Additional environment variables to inject into the workload, as a JSON
        mapping. Overrides charm-managed environment of the same name.
      default: "{}"
      type: string
